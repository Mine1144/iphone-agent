workflows:
  ios-ipa:
    name: Build IPA (iPhone Agent)
    instance_type: mac_mini_m2
    max_build_duration: 60
    scripts:
      - name: install deps
        script: npm ci
      - name: sync capacitor
        script: npx cap sync ios
      - name: verify plugin
        script: |
          grep -q "AgentPlugin" ios/App/App/capacitor.config.json
          grep -q "AgentPlugin" ios/App/CapApp-SPM/Package.swift
      - name: build
        script: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$HOME/dd" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: package ipa
        script: |
          APP_DIR="$HOME/dd/Build/Products/Release-iphoneos/App.app"
          mkdir -p dist/Payload
          cp -R "$APP_DIR" dist/Payload/iPhoneAgent.app
          cd dist
          zip -qry iPhoneAgent-unsigned.ipa Payload
          ls -lh iPhoneAgent-unsigned.ipa
    artifacts:
      - dist/iPhoneAgent-unsigned.ipa
    caching:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $HOME/.npm
