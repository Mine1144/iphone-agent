workflows:
  ios-ipa:
    name: Build IPA (iPhone Agent)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: install dependencies
        script: npm ci
      - name: sync capacitor
        script: npx cap sync ios
      - name: verify native plugin
        script: |
          grep -q "AgentPlugin" ios/App/App/capacitor.config.json || { echo "::error::AgentPlugin ไม่ได้ register"; exit 1; }
          grep -q "AgentPlugin" ios/App/CapApp-SPM/Package.swift || { echo "::error::AgentPlugin ไม่ได้อยู่ใน Package.swift"; exit 1; }
          echo "native plugin wired OK"
      - name: build app
        script: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$HOME/dd" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: package ipa
        script: |
          APP_DIR="$HOME/dd/Build/Products/Release-iphoneos/App.app"
          if [ ! -d "$APP_DIR" ]; then echo "::error::ไม่พบ App.app"; exit 1; fi
          rm -rf dist && mkdir -p dist/Payload
          cp -R "$APP_DIR" dist/Payload/iPhoneAgent.app
          cd dist
          zip -qry iPhoneAgent-unsigned.ipa Payload
          ls -lh iPhoneAgent-unsigned.ipa
    artifacts:
      - dist/iPhoneAgent-unsigned.ipa
      - /tmp/xcodebuild_logs/*.log
